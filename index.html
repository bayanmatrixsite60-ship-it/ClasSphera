.ep-br header{display:flex;justify-content:space-between;gap:.6rem;margin-bottom:.4rem;font-size:.86rem}.ep-br small{color:#9aa6d6}
.ep-lock{max-width:30rem;margin:2rem auto;padding:1.6rem;border-radius:20px;background:#0b1226;border:1px solid rgba(56,189,248,.28);text-align:center}
.ep .chip{background:#0f1731;color:#dfe5ff;border-color:rgba(56,189,248,.35)}
.ep .chip.on{background:rgba(16,185,129,.2);color:#6ee7b7;border-color:#10B981}
.ep .btn{background:#0f1731;color:#e6e9f5;border-color:rgba(56,189,248,.4)}.ep .btn.pri{background:linear-gradient(135deg,#38BDF8,#10B981);color:#04141c;border:0}
.ep select,.ep input{background:#080a18!important;color:#e6e9f5;border:1px solid #3a4390;border-radius:12px}
.ep .empty{background:#0a0d26;border-color:#2a3170;color:#9aa6d6}
</style>
<style id="v13">
/* v13: spotless rendering - no blur/mask/blend/filter layers, no dash artefacts */
*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;will-change:auto!important;mix-blend-mode:normal!important;-webkit-mask-image:none!important;mask-image:none!important;filter:none!important;-webkit-tap-highlight-color:transparent}
.hero::before,.hero::after,.pv::before,#splash::before{content:none!important;display:none!important}
.ia [stroke-dasharray],.vz [stroke-dasharray],.ep-art [stroke-dasharray],.gi [stroke-dasharray],.harts [stroke-dasharray]{stroke-dasharray:none!important}
html,body{background:#070812!important;background-image:none!important;overflow-x:clip;-webkit-font-smoothing:antialiased}
img,svg{image-rendering:auto}svg{shape-rendering:geometricPrecision}
</style>
<style id="v14">
/* v14: no white 1px highlights (they showed up as white dashes on rounded corners) and no currentColor rules */
hr{border:0;border-top:1px solid var(--line)}
.ic{box-shadow:0 14px 32px rgba(0,0,0,.55),0 0 22px rgba(6,182,212,.14)!important}
.glass{box-shadow:0 12px 34px #0007}
.harts svg{box-shadow:0 26px 70px rgba(6,182,212,.35)}
.fcb{border-color:rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.fcb.wa{box-shadow:0 8px 24px rgba(37,211,102,.4)}
.fcb.call{box-shadow:0 8px 24px rgba(6,182,212,.4)}
.fcb.mail{box-shadow:0 8px 24px rgba(129,140,248,.4)}
</style>

function saveStaff(){if(!adm())return;const v=[1,2,3,4,5,6].map(i=>$('#f'+i).value.trim());if(!v[0])return toast('Enter a name');if(v.some(bad))return;const x=w();x.sn++;x.staff.push({id:'STF-'+String(x.sn).padStart(3,'0'),name:v[0],subj:v[1],join:v[2],sal:v[3],cred:v[4],phone:v[5]});save();close();render()}

async function notify(){const x=w(),rec=x.att[today()]||{},m=x.students.filter(s=>rec[s.id]).map(s=>({to:s.gphone,name:s.name,status:rec[s.id].toLowerCase(),inst:x.inst.name,text:`${s.name} was ${rec[s.id].toLowerCase()} today at ${x.inst.name}.`}));if(!m.length)return toast('Mark attendance first');
 try{if(!/^[0-9a-f]{64}$/.test(x.nk||'')){x.nk=[...crypto.getRandomValues(new Uint8Array(32))].map(b=>b.toString(16).padStart(2,'0')).join('');save()}const ms=m.filter(a=>a.to).map(a=>({to:a.to,name:a.name,status:a.status,inst:a.inst}));if(!ms.length)return toast('No guardian phone numbers on file');const j=await post('/api/notify',{sub:S.user.sub,id:x.id,key:x.nk,messages:ms});x.notes.unshift(...m.filter(a=>a.to).map(a=>'Sent: '+a.text));toast(j.failed?j.sent+' alerts sent, '+j.failed+' failed':'Guardian alerts sent')}catch(e){x.notes.unshift(...m.map(a=>'Not sent (service unreachable): '+a.text));toast('Alert service unreachable. Nothing was sent.')}save();render()}
function saveMarks(){const sub=$('#ms').value.trim();if(!sub)return toast('Enter a subject or exam');if(bad(sub))return;let n=0;document.querySelectorAll('.sc').forEach(i=>{if(i.value!==''){w().students.find(a=>a.id===i.dataset.id).marks[sub]=Math.max(0,Math.min(100,+i.value));n++}});save();toast(n+' scores saved');render()}
function localPaper(b){const m={Easy:'state and recall',Medium:'explain and apply',Hard:'analyze and justify'}[b.difficulty];return`${b.kind}: ${b.subject} · ${b.chapter} · ${b.difficulty}\n\nSection A (10 × 1): define key terms from the chapter.\nSection B (5 × 4): ${m} the main concepts.\nSection C (2 × 10): extended answers with examples.\n\nPlan: 10 min recap, 25 min teaching, 15 min practice, 10 min quiz.`}

 try{const j=await post('/api/ai',b);$('#ao').textContent=j.text}catch(e){$('#ao').textContent=localPaper(b)+'\n\nBasic draft made on your device because the AI service is unreachable.'}}

async function addUser(){if(!adm())return;const nm=$('#un').value.trim(),e=nph($('#ue').value),em=$('#um').value.trim().toLowerCase(),r=$('#ur').value,p=$('#up').value;if(!nm||!e||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||p.length<8)return toast('Enter a name, phone, email and an 8+ character password');if(bad(nm))return;if(w().users.some(u=>u.email===e))return toast('That phone number already has access');
