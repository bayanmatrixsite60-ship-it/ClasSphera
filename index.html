function stuForm(){modal(`<h3 class="text-lg font-bold">Add student</h3>${fld('f1','Full name')}${fld('f2','Class')}${fld('f3','Location')}${fld('f4','Guardian name')}${fld('f5','Guardian phone','','tel')}${sel('f6','Residential status',['Non-resident','Resident (hostel)'])}<button class="btn pri w-full mt-4" onclick="saveStu()">Save student</button>`)}
function saveStu(){if(!adm())return;const v=[1,2,3,4,5,6].map(i=>$('#f'+i).value.trim());if(!v[0])return toast('Enter the student’s name');if(v.some(bad))return;const x=w();x.sn++;x.students.push({id:'STU-'+String(x.sn).padStart(4,'0'),name:v[0],cls:v[1],loc:v[2],gname:v[3],gphone:v[4],res:v[5],meals:'',prev:'',goal:'',quran:'',feeAmt:'',feeCyc:'monthly',marks:{}});save();close();render()}

function delStu(id){if(!adm()||!confirm('Remove this student permanently?'))return;const x=w();x.students=x.students.filter(s=>s.id!==id);S.sid=null;save();render()}
function staffForm(){modal(`<h3 class="text-lg font-bold">Add staff</h3>${fld('f1','Full name')}${fld('f2','Subject or role')}${fld('f3','Joining date','','date')}${fld('f4','Monthly salary')}${fld('f5','Credentials')}${fld('f6','Phone','','tel')}<button class="btn pri w-full mt-4" onclick="saveStaff()">Save staff</button>`)}

function mark(id){const x=w(),k=S.at==='stu'?'att':'tatt',d=today();x[k][d]=x[k][d]||{};x[k][d][id]=x[k][d][id]==='Present'?'Absent':'Present';x[k][d][id+'_t']=new Date().toLocaleTimeString();save();render()}
async function notify(){const x=w(),rec=x.att[today()]||{},m=x.students.filter(s=>rec[s.id]).map(s=>({to:s.gphone,sender:x.inst.name,text:`${s.name} was ${rec[s.id].toLowerCase()} today at ${x.inst.name}.`}));if(!m.length)return toast('Mark attendance first');
 try{await post('/api/notify',{sub:S.user.sub,messages:m.filter(a=>a.to)});x.notes.unshift(...m.map(a=>'Sent: '+a.text));toast('Guardian alerts sent')}catch(e){x.notes.unshift(...m.map(a=>'Not sent (service unreachable): '+a.text));toast('Alert service unreachable. Nothing was sent.')}save();render()}
function saveMarks(){const sub=$('#ms').value.trim();if(!sub)return toast('Enter a subject or exam');if(bad(sub))return;let n=0;document.querySelectorAll('.sc').forEach(i=>{if(i.value!==''){w().students.find(a=>a.id===i.dataset.id).marks[sub]=Math.max(0,Math.min(100,+i.value));n++}});save();toast(n+' scores saved');render()}
function localPaper(b){const m={Easy:'state and recall',Medium:'explain and apply',Hard:'analyze and justify'}[b.difficulty];return`${b.kind}: ${b.subject} · ${b.chapter} · ${b.difficulty}\n\nSection A (10 × 1): define key terms from the chapter.\nSection B (5 × 4): ${m} the main concepts.\nSection C (2 × 10): extended answers with examples.\n\nPlan: 10 min recap, 25 min teaching, 15 min practice, 10 min quiz.`}
async function genPaper(){const b={sub:S.user.sub,subject:$('#as').value.trim(),chapter:$('#ac').value.trim(),difficulty:$('#ad').value,kind:$('#ak').value};if(!b.subject||!b.chapter)return toast('Enter a subject and chapter');if(bad(b.subject+b.chapter))return;$('#ao').textContent='Generating…';

async function addUser(){if(!adm())return;const nm=$('#un').value.trim(),e=nph($('#ue').value),em=$('#um').value.trim().toLowerCase(),r=$('#ur').value,p=$('#up').value;if(!nm||!e||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||p.length<8)return toast('Enter a name, phone, email and an 8+ character password');if(bad(nm))return;if(w().users.some(u=>u.email===e))return toast('That phone number already has access');
 const salt=rid()+rid(),u={name:nm,mail:em,email:e,role:r,salt,p:await hash(salt+p)};if(LED.includes(r)){if(!S.DK)return toast('Unlock the ledger first');u.wk=await wrapFor(p,salt)}w().users.push(u);save();render();toast('Member added')}

 modal(`<h3 class="font-bold mb-2">${ok?'Sent to the founder':'Saved, will send when the service is reachable'}</h3><div class="glass p-4 text-sm"><div class="font-bold">${esc(S.ws?.inst.name||'Visitor')}</div><div class="mu text-xs">${S.ws?`${S.ws.id} · ${esc(S.user.sub)}.classphera.com`:'Not signed in'}</div><div class="mt-2"><b>${esc(tp)}</b></div><div>${esc(m)}</div></div><button class="btn w-full mt-4" onclick="closeM()">Close</button>`)}
